<svg xmlns="http://www.w3.org/2000/svg" width="600" height="80">
  <defs>
    <style>
      .vibrate {
        font-family: ui-monospace, "SFMono-Regular", "Consolas", "Menlo", monospace;
        font-weight: 700;
        font-size: 34px;
        letter-spacing: 1px;
        animation: vibrate 0.6s linear infinite both;
        /* Contorno en vez de depender del media query (prefers-color-scheme sigue
           el SO, no el tema elegido en GitHub, así que a veces se volvía invisible) */
        fill: #ffffff;
        stroke: #000000;
        stroke-width: 1px;
        paint-order: stroke fill;
      }

      /* Efecto de vibración */
      @keyframes vibrate {
        0% { transform: translate(0) }
        20% { transform: translate(-0.5px, 0.5px) }
        40% { transform: translate(-0.5px, -0.5px) }
        60% { transform: translate(0.5px, 0.5px) }
        80% { transform: translate(0.5px, -0.5px) }
        100% { transform: translate(0) }
      }
    </style>
  </defs>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="vibrate">
    Hello, I'm Franco
  </text>
</svg>
